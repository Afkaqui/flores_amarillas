# These zones and limits apply only to Flores Amarillas.
limit_req_zone $binary_remote_addr zone=flores_per_ip:10m rate=10r/s;
limit_req_zone $server_name zone=flores_total:1m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=flores_connections:10m;

server {
    listen 80;
    server_name amarillas.pascare.tech;
    location /.well-known/acme-challenge/ { root /etc/nginx/acme-challenge; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name amarillas.pascare.tech;

    ssl_certificate     /etc/nginx/certs/pascare.crt;
    ssl_certificate_key /etc/nginx/certs/pascare.key;


    # Official Cloudflare ranges checked on 2026-09-14.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 10M;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;

    # El panel tiene un único origen; los regalos anteriores siguen aquí.
    location = /metrics { return 308 https://floresparati.site$request_uri; }
    location ^~ /metrics/ { return 308 https://floresparati.site$request_uri; }

    location / {
        limit_req zone=flores_per_ip burst=80 nodelay;
        limit_req zone=flores_total burst=200 nodelay;
        limit_conn flores_connections 20;
        proxy_pass         http://host.docker.internal:3061;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
    }
}
