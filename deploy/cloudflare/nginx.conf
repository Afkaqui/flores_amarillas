worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # No query strings, cookies or authorization headers in access logs.
    log_format minimal '$http_cf_connecting_ip $request_method $uri $status $request_time';
    access_log /dev/stdout minimal;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Only the outbound tunnel reaches this gateway; there are no published ports.
    # Cloudflare overwrites CF-Connecting-IP and X-Forwarded-Proto at its edge.
    limit_req_zone $http_cf_connecting_ip zone=per_ip:10m rate=10r/s;
    limit_req_zone $server_name zone=total:1m rate=100r/s;
    limit_conn_zone $http_cf_connecting_ip zone=connections:10m;
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 8080 default_server;
        server_name _;
        return 404;
    }
    server {
        listen 8080;
        server_name www.floresparati.site;
        return 308 https://floresparati.site$request_uri;
    }
    server {
        listen 8080;
        server_name floresparati.site;
        if ($http_cf_connecting_ip = "") { return 403; }
        if ($http_x_forwarded_proto = "http") { return 308 https://floresparati.site$request_uri; }
        if ($http_x_forwarded_proto != "https") { return 403; }

        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=(), microphone=(self)" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

        location ~ /\. { return 404; }
        location / {
            limit_req zone=per_ip burst=80 nodelay;
            limit_req zone=total burst=200 nodelay;
            limit_conn connections 20;
            set $flowers_upstream flores-amarillas:3000;
            proxy_pass http://$flowers_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            # Replace user-supplied forwarding chains; Express trusts one hop.
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 90s;
            proxy_send_timeout 30s;
        }
    }
}
