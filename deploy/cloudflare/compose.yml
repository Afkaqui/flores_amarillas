name: flores-edge
services:
  gateway:
    image: nginxinc/nginx-unprivileged@sha256:adf5042a17f4ecdd200c595fa9ffd1be37efb18f89a830bd1a00e4ab4d59d42c
    container_name: flores_gateway
    user: "1000:1000"
    entrypoint: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [edge, flowers]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  tunnel:
    image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    container_name: flores_tunnel
    user: "1000:1000"
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - ./tunnel.yml:/etc/cloudflared/config.yml:ro
      - ${TUNNEL_CREDENTIAL_FILE:?Set the VPS tunnel credential path}:/run/secrets/tunnel.json:ro
    networks: [edge]
    depends_on: [gateway]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
networks:
  edge: {}
  flowers:
    external: true
    name: flores-amarillas_default
